workflows:
  android-debug:
    name: Veyra Android Debug
    max_build_duration: 30
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install
      - name: Build web app
        script: pnpm run build
      - name: Add Android platform if missing
        script: npx cap add android || npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/**/*.apk
