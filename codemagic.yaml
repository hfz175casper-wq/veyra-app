workflows:
  android-release:
    name: Veyra Android Release
    max_build_duration: 30
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          cd clone
          yarn install
      - name: Build web app
        script: |
          cd clone
          yarn build
      - name: Sync Capacitor and Build APK
        script: |
          cd clone
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - clone/android/app/build/outputs/apk/release/*.apk
