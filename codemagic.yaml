workflows:
  android-debug:
    name: Veyra Android Debug
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          corepack disable
          npm install -g pnpm@9.15.0
          pnpm install --no-frozen-lockfile
      - name: Build web app
        script: |
          export PORT=3000
          export BASE_PATH=/
          pnpm run typecheck
          pnpm --filter '!./artifacts/mockup-sandbox' -r --if-present run build
      - name: Add Android platform if missing
        script: npx cap add android || npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/**/*.apk
