apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// VEYRA ? release imza ??z?m?
// ---------------------------------------------------------------------------
// ?ki kaynak desteklenir (?ncelik: ortam de?i?keni ? keystore.properties):
//
//   1) CI / gizli ortam:
//        VEYRA_KEYSTORE_PATH     (keystore dosyas?n?n yolu; CI'da base64'ten a??l?r)
//        VEYRA_KEYSTORE_PASSWORD
//        VEYRA_KEY_ALIAS
//        VEYRA_KEY_PASSWORD
//   2) Yerel geli?tirme:
//        android/keystore.properties   (?ablon: keystore.properties.example)
//
// Hi?biri tan?ml? de?ilse Gradle ?ALI?MAYA DEVAM EDER ancak release derlemesi
// imzas?z olur ve bir uyar? bas?l?r (APK Play Store'a y?klenemez; test i?in
// yine de kurulabilir de?ildir ? imza i?in make-keystore.sh kullan?n).
// ---------------------------------------------------------------------------

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def resolveSigningValue = { String envName, String propKey ->
    def value = System.getenv(envName)
    if (value == null || value.trim().isEmpty()) {
        value = keystoreProperties.getProperty(propKey)
    }
    return value
}

def signingStorePath = resolveSigningValue('VEYRA_KEYSTORE_PATH', 'storeFile')
def signingStorePassword = resolveSigningValue('VEYRA_KEYSTORE_PASSWORD', 'storePassword')
def signingKeyAliasValue = resolveSigningValue('VEYRA_KEY_ALIAS', 'keyAlias')
def signingKeyPassword = resolveSigningValue('VEYRA_KEY_PASSWORD', 'keyPassword')

// G?reli yollar android/ dizinine g?re ??z?l?r.
def signingStoreFile = null
if (signingStorePath != null && !signingStorePath.trim().isEmpty()) {
    def candidate = new File(signingStorePath)
    signingStoreFile = candidate.isAbsolute() ? candidate : new File(rootProject.projectDir, signingStorePath)
}

def hasReleaseSigning = signingStoreFile != null && signingStoreFile.isFile() &&
        signingStorePassword != null && !signingStorePassword.isEmpty() &&
        signingKeyAliasValue != null && !signingKeyAliasValue.isEmpty() &&
        signingKeyPassword != null && !signingKeyPassword.isEmpty()

if (hasReleaseSigning) {
    logger.lifecycle("[VEYRA] Release keystore bulundu: ${signingStoreFile.name}")
} else {
    logger.warn("[VEYRA] Release keystore BULUNAMADI ? assembleRelease imzas?z ?retilir.")
    logger.warn("[VEYRA] ?mza i?in: scripts/android/make-keystore.sh  veya  CI secret'lar? (docs/ANDROID.md).")
}

// S?r?m bilgisi: CI, tag'den besleyebilir (?r. VEYRA_VERSION_NAME=1.2.0).
def ciVersionCode = System.getenv('VEYRA_VERSION_CODE')
def ciVersionName = System.getenv('VEYRA_VERSION_NAME')

android {
    namespace = "app.veyra.mobile"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.veyra.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAliasValue
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // NOT: minify kapal?. Capacitor eklentileri reflection ile kay?t olur;
            // R8 etkinle?tirilirse plugin s?n?flar? k?rp?labilir.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // ??kt? adlar?n? markala: veyra-1.0.0-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "veyra-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // VeyraWebChromeClient'in sistem ?ubu?u y?netimi (WindowInsetsControllerCompat).
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push notifications won't work")
}
